<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Proyecto Integrador</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h2 style="margin-bottom: 20px; text-align: center;">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="username" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="admin123" required>
      </div>
      <button type="submit" class="btn">Ingresar</button>
      <p id="errorMsg" style="color: red; margin-top: 10px; text-align: center;"></p>
      <p style="margin-top: 15px; text-align: center; color: #64748b; font-size: 0.85rem;">
        Usuario de prueba: <strong>admin</strong> / Contraseña: <strong>admin123</strong>
      </p>
    </form>
  </div>

  <script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const usernameInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: usernameInput, password: passwordInput })
    });
    
    const data = await res.json();
    
    if (data.success) {
      // Guardamos una marca en el navegador de que el usuario inició sesión correctamente
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('username', usernameInput);
      
      // Redireccionamos a la página protegida
      window.location.href = 'index.html';
    } else {
      document.getElementById('errorMsg').innerText = data.message;
    }
  });
</script>
</body>
</html>
